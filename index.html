var isAdmin=false, adminCheckedFor=null, adminData=null, adminNameEdit=null;
function checkAdmin(){
  if(!sb||!sbUser){ isAdmin=false; return; }
  if(adminCheckedFor===sbUser.id) return;
  adminCheckedFor=sbUser.id;
  sb.from('admins').select('user_id').eq('user_id',sbUser.id).maybeSingle().then(function(r){
    isAdmin=!!(r&&r.data&&r.data.user_id);
    renderHdrMenu();
    if(isAdmin){ loadCrewTimers().then(function(){ if((view.name==='dashboard'||view.name==='admin')&&!uiBusy()) render(); }); }
  },function(){ isAdmin=false; });
}
function loadAdminData(force){
  if(!sb||!sbUser) return;
  if(adminData&&adminData.loading) return;
  if(adminData&&!adminData.error&&!force) return;
  adminData={loading:true};
  Promise.all([
    profilesQ(null,false),
    sb.from('admins').select('user_id'),
    sb.from('project_members').select('project_id,user_id'),
    sb.from('projects').select('id,name,owner_id,deleted_at,created_at')
  ]).then(function(rs){
    if(rs[0].error){ adminData={error:(rs[0].error.message||'Could not load admin data')}; if(view.name==='admin')render(); return; }
    adminData={ profiles:rs[0].data||[],
      admins:(rs[1].data||[]).map(function(a){return a.user_id;}),
      members:rs[2].data||[], projects:rs[3].data||[] };
    if(view.name==='admin')render();
  },function(){ adminData={error:'Could not load admin data'}; if(view.name==='admin')render(); });
}
function adminFn(action,payload,doneMsg){
  var body={action:action};
  for(var k in payload) body[k]=payload[k];
  sb.functions.invoke('admin',{body:body}).then(function(r){
    if(r.error){ toast('Admin action failed: '+(r.error.message||'function error')); return; }
    if(r.data&&r.data.error){ toast('Admin action failed: '+r.data.error); return; }
    toast(doneMsg||'Done');
    adminData=null;
    if(action==='setAdmin'){ adminCheckedFor=null; checkAdmin(); }
    if(view.name==='admin')render();
  },function(){ toast('Admin action failed: network error'); });
}

function adminRestoreProject(pid){
  // v5.0 client-side restore (no Edge Function deploy needed): the project
  // row plus every child row deleted at-or-after the project's deletion
  // (individually deleted children stay deleted).
  var pr=((adminData&&adminData.projects)||[]).filter(function(x){return x.id===pid;})[0];
  var ts=pr&&pr.deleted_at;
  if(!pr||!ts){ toast('Project is not deleted'); return; }
  if(!confirm('Restore "'+pr.name+'" and everything deleted with it?')) return;
  var tables=['time_entries','cable_pulls','materials','poe_switches','port_switches','ip_assignments','technicians'];
  var jobs=[sb.from('projects').update({deleted_at:null}).eq('id',pid)];
  tables.forEach(function(t){
    jobs.push(sb.from(t).update({deleted_at:null}).eq('project_id',pid).gte('deleted_at',ts));
  });
  function restoreSwitchKids(swTable,kidTable){
    return sb.from(swTable).select('id,deleted_at').eq('project_id',pid).then(function(r){
      var ids=(r.data||[]).filter(function(s){ return !s.deleted_at||s.deleted_at>=ts; }).map(function(s){ return s.id; });
      if(!ids.length) return;
      return sb.from(kidTable).update({deleted_at:null}).in('switch_id',ids).gte('deleted_at',ts);
    });
  }
  jobs.push(restoreSwitchKids('poe_switches','poe_devices'));
  jobs.push(restoreSwitchKids('port_switches','port_entries'));
  Promise.all(jobs).then(function(){
    toast('Project restored');
    adminData=null; loadAdminData(true);
    if(view.name==='admin') render();
    refreshFromServer(false);
  },function(e){ toast('Restore failed: '+((e&&e.message)||'error')); });
}
function adminPurgeOldDeleted(){
  var old=((adminData&&adminData.projects)||[]).filter(function(x){
    return x.deleted_at&&new Date(x.deleted_at).getTime()<Date.now()-30*864e5;
  });
  if(!old.length){ toast('Nothing deleted 30+ days ago'); return; }
  if(!confirm('Permanently delete '+old.length+' project(s) deleted over 30 days ago? This cannot be undone.')) return;
  var chain=Promise.resolve(), done=0;
  old.forEach(function(pr){
    chain=chain.then(function(){
      return sb.functions.invoke('admin',{body:{action:'purgeProject',projectId:pr.id}}).then(function(){ done++; },function(){});
    });
  });
  chain.then(function(){
    toast(done+' old project(s) permanently deleted');
    adminData=null; loadAdminData(true);
    if(view.name==='admin') render();
  });
}
function adminRemoveMember(pid,uid){
  if(!confirm('Remove this member from the project?'))return;
  adminFn('removeMembership',{projectId:pid,userId:uid},'Member removed');
}
function adminEditName(uid){ adminNameEdit=uid; render(); }
function adminCancelName(){ adminNameEdit=null; render(); }
function adminSaveName(uid){
  var v=val('ad_name_'+uid);
  adminNameEdit=null;
  adminFn('setDisplayName',{userId:uid,displayName:v},'Name saved');
}

/* ---------- header menu / sharing ---------- */
function renderHdrMenu(){
  var m=$('hdrMenu'); if(!m) return;
  if(sbReady&&!sbUser){ m.innerHTML=''; return; }
  var h='';
  if(view.name==='project'){
    var p=projById(view.id);
    if(p&&(!p.owner_id||(sbUser&&p.owner_id===sbUser.id)))
      h+='<button onclick="openShareDialog()">Share project</button>';
  }
  h+='<button onclick="openImportForm()">Import project</button>'
    +'<button onclick="goBackup()">Backup / Restore</button>'
    +'<button onclick="goAbout()">About</button>';
  if(isAdmin) h+='<button onclick="goAdmin()">Admin</button>';
  if(sbReady&&sbUser){
    h+='<button onclick="openDiag()">Diagnostics</button>'
      +'<button onclick="refreshFromServer(true)">Refresh now</button>'
      +'<button onclick="doSignOut()">Sign out</button>';
  }
  m.innerHTML=h;
}
function openShareDialog(){
  var p=projById(view.id); if(!p||!sb||!sbUser) return;
  toggleHdrMenu();
  closeShareDialog();
  var ov=document.createElement('div');
  ov.className='dlg-ov'; ov.id='shareDlg';
  shareSel={};
  ov.innerHTML='<div class="dlg"><div class="cardhd"><h3>Share project</h3><button class="dlg-x" aria-label="Close" onclick="closeShareDialog()">\u00d7</button></div>'
    +'<p class="mut" style="margin-top:0">Invite people to collaborate on &ldquo;'+esc(p.name)+'&rdquo;.</p>'
    +'<div class="seclbl">Members</div><div id="share_list"><p class="mut">Loading…</p></div>'
    +'<div class="seclbl" style="margin-top:12px">Invite — tap to select</div><div id="share_invite"><p class="mut">Loading…</p></div>'
    +'<button class="btn pri" id="share_inv_btn" style="width:100%;margin-top:12px" disabled onclick="inviteSelected()">Select people to invite</button>'
    +'<button class="btn sec" style="width:100%;margin-top:8px" onclick="closeShareDialog()">Done</button></div>';
  ov.addEventListener('click',function(e){ if(e.target===ov) closeShareDialog(); });
  document.body.appendChild(ov);
  loadShareList();
}
function closeShareDialog(){ var o=document.getElementById('shareDlg'); if(o) o.remove(); }
function loadShareList(){
  var p=projById(view.id); if(!p||!sb) return;
  var box=document.getElementById('share_list'); if(!box) return;
  sb.from('project_members').select('user_id,role').eq('project_id',p.id).then(function(r){
    if(r.error){ box.innerHTML='<div class="err">Could not load members.</div>'; return; }
    var ids=(r.data||[]).map(function(m){ return m.user_id; });
    var ownerId=p.owner_id||sbUser.id;
    var allIds=ids.concat([ownerId]);
    profilesQ(allIds).then(function(r2){
      var labels={}; (r2.data||[]).forEach(function(pr){ labels[pr.id]=profLabel(pr); });
      var h='<div class="kv"><span>'+esc(labels[ownerId]||'you')+'</span><span class="mut">owner</span></div>';
      (r.data||[]).forEach(function(m){
        if(m.user_id===ownerId) return;
        h+='<div class="kv"><span>'+esc(labels[m.user_id]||m.user_id.slice(0,8)+'…')+'</span>'
          +'<button class="iconbtn" aria-label="Remove member" onclick="removeMember(\''+m.user_id+'\')">'+TRASH_SVG+'</button></div>';
      });
      box.innerHTML=h;
      loadInviteList(ids,ownerId);
    });
  });
}
var shareSel={};
function loadInviteList(memberIds,ownerId){
  var box=document.getElementById('share_invite'); if(!box||!sb) return;
  profilesQ(null,true).then(function(r){
    if(r.error){ box.innerHTML='<div class="err">Could not load users.</div>'; return; }
    var users=(r.data||[]).filter(function(u){
      return u.id!==sbUser.id&&u.id!==ownerId&&memberIds.indexOf(u.id)<0;});
    if(!users.length){ box.innerHTML='<p class="mut">Everyone already has access.</p>'; updateInviteBtn(); return; }
    box.innerHTML=users.map(function(u){
      var nm=(u.display_name||'').trim();
      var who=nm?('<span><b>'+esc(nm)+'</b><div class="mut" style="font-size:.76rem">'+esc(u.email||'')+'</div></span>'):esc(u.email||'');
      return '<label class="kv" style="cursor:pointer;align-items:center"><span style="display:flex;align-items:center;gap:10px"><input type="checkbox"'+(shareSel[u.id]?' checked':'')+' onchange="toggleShareSel(\''+u.id+'\',this.checked)" style="width:22px;height:22px;margin:0;padding:0;flex:0 0 auto;accent-color:#2f7fc4">'+who+'</span></label>';
    }).join('');
    updateInviteBtn();
  });
}
function toggleShareSel(uid2,on){ if(on)shareSel[uid2]=1; else delete shareSel[uid2]; updateInviteBtn(); }
function updateInviteBtn(){
  var b=document.getElementById('share_inv_btn'); if(!b) return;
  var n=Object.keys(shareSel).length;
  b.disabled=!n;
  b.textContent=n?('Invite '+n+(n===1?' person':' people')):'Select people to invite';
}
function inviteSelected(){
  var ids=Object.keys(shareSel); if(!ids.length) return;
  var rows=ids.map(function(u){ return {project_id:view.id,user_id:u,role:'member'}; });
  sb.from('project_members').upsert(rows,{onConflict:'project_id,user_id'}).then(function(r){
    if(r.error){ toast('Invite failed'); return; }
    toast('Invited '+ids.length+(ids.length===1?' person':' people'));
    shareSel={};
    loadShareList(); loadMembers(view.id,true);
  });
}
function removeMember(uid2){
  if(!confirm('Remove this person from the project?')) return;
  sb.from('project_members').delete().eq('project_id',view.id).eq('user_id',uid2).then(function(r){
    if(r.error){ toast('Could not remove'); return; }
    loadShareList(); loadMembers(view.id,true);
  });
}

  view={name:'dashboard'};delete view.id;curTab='overview';
  lastNav=JSON.stringify(navState());
})();
bootAuth();
