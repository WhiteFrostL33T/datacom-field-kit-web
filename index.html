<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field Kit">
<meta name="theme-color" content="#12141f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Datacom Field Kit</title>
<style>
:root{
  --bg:#0c0e16; --panel:#181b28; --panel2:#1f2333; --line:#343a50;
  --text:#f0f2f8; --muted:#969cb4; --accent:#7c8cff; --brand:#12141f;
  --green:#34d399; --amber:#fbbf24; --red:#f87171; --chip:#232839;
  --teal:#2dd4bf; --org:#fb923c; --pnk:#f472b6;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:16px;}
button,input,select,textarea{font:inherit;color:var(--text);}
input,select,textarea{background:#0a0c12;border:1px solid var(--line);border-radius:12px;
  padding:12px;width:100%;margin:4px 0 10px;min-width:0;}
input[type=date],input[type=time],input[type=datetime-local]{-webkit-appearance:none;appearance:none;
  min-width:0;max-width:100%;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent);}
label{font-size:.82rem;color:var(--muted);display:block;margin-top:6px;}
textarea{min-height:90px;resize:vertical;}
header{position:sticky;top:0;z-index:20;background:var(--brand);padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
  display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.4);}
header .ttl{font-size:1.15rem;font-weight:700;flex:1;letter-spacing:.2px;}
header .ttl small{display:block;font-size:.72rem;font-weight:400;color:var(--muted);}
.hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;
  border-radius:10px;padding:9px 13px;font-size:.9rem;cursor:pointer;min-height:44px;}
main{padding:14px 12px 150px;max-width:860px;margin:0 auto;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:14px;margin:0 0 12px;}
.card h3{margin:0 0 6px;font-size:1.05rem;}
.card h4{margin:14px 0 6px;font-size:.95rem;color:#d5dbf0;}
.mut{color:var(--muted);font-size:.86rem;}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.row>*{flex:1;min-width:0;}
.row .fx0{flex:0 0 auto;}
.btn{background:var(--accent);border:none;border-radius:12px;padding:12px 16px;
  font-weight:600;cursor:pointer;min-height:48px;width:100%;color:#0d1020;}
.btn.sec{background:var(--chip);font-weight:500;color:var(--text);}
.btn.grn{background:var(--green);}
.btn.red{background:var(--red);}
.btn.sml{padding:8px 12px;min-height:40px;width:auto;font-size:.9rem;}
button:disabled{opacity:.45;}
.chip{display:inline-block;background:var(--chip);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;font-size:.76rem;margin:2px 3px 2px 0;color:#c6cce0;}
.chip.on{background:#2b3050;color:#e3e8ff;border-color:#454e7d;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch;}
.tab{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:10px 16px;cursor:pointer;font-size:.92rem;min-height:44px;}
.tab.act{background:var(--accent);color:#0d1020;border-color:var(--accent);font-weight:600;}
table{width:100%;border-collapse:collapse;font-size:.92rem;}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.4px;}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);}
.tbadge{display:inline-block;font-size:.68rem;padding:2px 10px;border-radius:10px;color:#e8f0f8;white-space:nowrap;}
.kv:last-child{border-bottom:none;}
.kv b{font-weight:600;}
.bar{height:14px;background:#0a0c12;border-radius:7px;overflow:hidden;border:1px solid var(--line);}
.bar>i{display:block;height:100%;background:var(--green);}
.bar>i.warn{background:var(--amber);} .bar>i.over{background:var(--red);}
.err{background:#3a1d22;border:1px solid var(--red);color:#ffb4ae;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.9rem;}
.ok{background:#14302a;border:1px solid var(--green);color:#a9e8c3;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.9rem;}
.switch{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);}
.switch:last-child{border-bottom:none;}
.tgl{position:relative;width:56px;height:32px;flex:0 0 auto;}
.tgl input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:2;}
.tgl i{position:absolute;inset:0;background:#3a415e;border-radius:999px;transition:.15s;}
.tgl i:after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;}
.tgl input:checked + i{background:var(--green);}
.tgl input:checked + i:after{left:27px;}
#timerbar{background:#2e2a12;border-bottom:2px solid var(--amber);color:#ffe1a8;
  padding:10px 14px;display:none;font-size:.95rem;}
#timerbar.show{display:flex;align-items:center;gap:10px;}
#timerbar .el{font-weight:700;font-variant-numeric:tabular-nums;}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:999px;
  font-size:.9rem;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:92vw;text-align:center;}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#10121c;
  border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.btab{flex:1;background:none;border:none;color:var(--muted);font-size:.72rem;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;min-height:58px;border-radius:999px;margin:2px 5px;}
.btab svg{width:26px;height:26px;flex:0 0 auto;}
.btab.act{color:#aeb8ff;background:#2c304a;}
.cardhd{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;}
.cardhd h3{margin:0;}
.gearbtn{background:var(--secbg);border:1px solid var(--line);color:var(--muted);border-radius:10px;
  width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
.gearbtn svg{width:20px;height:20px;}
.dlg-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:20px;}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:20px;
  max-width:420px;width:100%;max-height:80vh;overflow:auto;padding:18px;}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;}
.stat b{display:block;font-size:1.65rem;line-height:1.15;font-weight:800;}
.stat span{color:var(--muted);font-size:.8rem;}
.stat.hot b{color:#8fb8ff;}
.stat.warn b{color:#ff9a9a;}
button.stat{cursor:pointer;text-align:left;font:inherit;color:inherit;}
.seclbl{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px;}
.bigtime{font-size:2.4rem;font-weight:800;text-align:center;letter-spacing:2px;margin:8px 0 12px;font-variant-numeric:tabular-nums;}
.ver{display:inline-block;background:var(--chip);border:1px solid var(--line);color:#aeb8ff;
  border-radius:999px;padding:4px 14px;font-size:.85rem;margin:6px 0;}
.modtile{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:14px;cursor:pointer;color:var(--text);width:100%;}
.mod-ic{display:inline-flex;width:38px;height:38px;border-radius:11px;background:var(--chip);
  align-items:center;justify-content:center;color:var(--accent);}
.mod-ic svg{width:20px;height:20px;}
.feeditem{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);align-items:flex-start;}
.dashfeed .fib .mut{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.feeditem:last-child{border-bottom:none;}
.fic{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--chip);}
.fic svg{width:20px;height:20px;stroke:var(--accent);}
.fib{flex:1;min-width:0;}
.fib b{font-size:.92rem;}
.ftime{color:var(--muted);font-size:.76rem;white-space:nowrap;flex:0 0 auto;}
#toast.show{opacity:1;}
.big{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;}
.proj-head{display:flex;align-items:flex-start;gap:10px;}
.proj-head .grow{flex:1;min-width:0;}
.del{color:var(--red);background:none;border:none;cursor:pointer;font-size:.9rem;padding:8px;min-height:40px;}
.edt{color:var(--accent);background:none;border:none;cursor:pointer;font-size:.9rem;padding:8px;min-height:40px;}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;}
.seg button{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:10px;
  padding:11px 6px;cursor:pointer;min-height:48px;font-size:.9rem;}
.seg button.act{background:var(--accent);color:#0d1020;border-color:var(--accent);font-weight:600;}
.preset{flex:0 0 auto !important;min-width:0;}
.fab{position:fixed;right:18px;bottom:96px;width:62px;height:62px;border-radius:50%;
  background:var(--accent);color:#0d1020;font-size:30px;line-height:1;border:none;z-index:40;
  box-shadow:0 4px 16px rgba(0,0,0,.5);cursor:pointer;}
.projcard{cursor:pointer;}
.iconbtn{background:none;border:none;color:var(--muted);font-size:1.35rem;cursor:pointer;
  padding:8px 12px;min-width:44px;min-height:44px;border-radius:10px;}
.iconbtn svg{width:18px;height:18px;vertical-align:-3px;}
.cardmenu{position:relative;flex:0 0 auto;}
.cardmenu .cmenu{position:absolute;top:calc(100% + 2px);right:0;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;z-index:30;min-width:150px;overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.5);}
.cardmenu .cmenu button{display:block;width:100%;text-align:left;background:none;border:none;
  padding:13px 14px;font-size:.95rem;cursor:pointer;color:var(--text);}
.cardmenu .cmenu button.danger{color:var(--red);}
.btn.danger{background:#a33333;color:#fff;}
.btn.danger:disabled{opacity:.45;}
.hdrmenu{position:relative;flex:0 0 auto;}
.hdrmenu .cmenu{position:absolute;top:calc(100% + 6px);right:0;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;z-index:60;min-width:170px;overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.5);}
.hdrmenu .cmenu button{display:block;width:100%;text-align:left;background:none;border:none;
  padding:13px 14px;font-size:.95rem;cursor:pointer;color:var(--text);}
#deskSide{display:none;}
.deskonly,.deskflex{display:none;}
.deskStats{display:none;}
.dsnav{display:flex;width:100%;padding:11px 14px;border-radius:12px;background:none;border:none;
  color:var(--muted);font-size:.98rem;font-weight:600;cursor:pointer;text-align:left;}
.dsnav.act{background:#2c304a;color:#aeb8ff;}
.dsproj{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;background:none;border:none;
  color:var(--text);cursor:pointer;font-size:.92rem;border-radius:10px;}
.dsproj:hover{background:var(--chip);}
.dssync{display:flex;align-items:center;gap:8px;background:#14302a;color:#7ce7b0;border-radius:12px;
  padding:11px 13px;font-size:.86rem;font-weight:600;}
@media (min-width:1024px){
  main{max-width:none;margin-left:240px;margin-right:0;padding:22px 26px 60px;}
  header{position:fixed;top:0;right:0;left:auto;background:transparent;box-shadow:none;padding:10px 16px;pointer-events:none;}
  header .ttl{display:none !important;}
  header .hdrmenu{pointer-events:auto;margin-left:auto;}
  #timerbar.show{margin-left:240px;}
  #deskSide{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:240px;
    background:#10121c;border-right:1px solid var(--line);padding:20px 14px;z-index:35;overflow-y:auto;}
  #tabbar{display:none;}
  body.inproject #tabbar{display:flex;left:240px;right:0;top:auto;bottom:0;width:auto;
    flex-direction:row;justify-content:flex-start;padding:8px 14px;}
  body.inproject .btab{flex:0 0 auto;width:auto;min-height:48px;padding:10px 13px;}
  body.inproject .btab svg{width:23px;height:23px;}
  .projgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .projgrid .card{margin:0;}
  .modgrid{grid-template-columns:repeat(3,1fr) !important;}
  .fab{right:34px;bottom:34px;}
  #toast{bottom:40px;}
  .mobi{display:none !important;}
  .deskonly{display:block;}
  .deskflex{display:flex;}
  .deskStats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;}
  .deskStats .card{margin:0;}
  .statgrid{grid-template-columns:repeat(4,1fr);}
  .secgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start;}
  .secgrid .card{margin:0;}
  /* Admin desktop columns: each column is a vertical stack, so column
     heights stay independent (a tall cable card must not push the middle
     column's Users card below the fold). Mobile stacking is untouched. */
  .secgrid .seccol{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .deskHome2{display:grid;grid-template-columns:1fr;gap:12px;align-items:start;}
  .deskHome2 .card{margin:0;}
}
  /* v5.4 UI polish: one accent, pill status, skeletons, dialog + motion. */
  :root{ --accent:#2dd4bf; }
  .btab.act{color:#0d1020;background:var(--accent);border-color:var(--accent);}
  .card h3{font-size:1.05rem;font-weight:700;letter-spacing:.2px;}
  .card{padding:16px;}
  #syncstat{display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(45,212,191,.14);border:1px solid rgba(45,212,191,.35);color:#7ce7b0;font-size:.75rem;line-height:1.4;}
  #syncstat:empty{display:none;}
  #syncstat.warn{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.35);color:#fbbf24;}
  .dlg-ov{backdrop-filter:blur(6px);background:rgba(0,0,0,.6);}
  .dlg-x{background:none;border:none;color:var(--muted);font-size:1.5rem;line-height:1;padding:2px 6px;cursor:pointer;}
  .dlg{animation:dlgIn .15s ease-out;}
  @keyframes dlgIn{from{opacity:0;transform:scale(.97) translateY(6px);}to{opacity:1;transform:none;}}
  .cmenu{animation:menuIn .15s ease-out;}
  @keyframes menuIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .btn{transition:transform .1s ease,filter .15s ease;}
  .btn:active{transform:scale(.98);}
  #toast{transition:opacity .2s ease;}
  .skel{background:#232842;border-radius:10px;position:relative;overflow:hidden;}
  .skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);transform:translateX(-100%);animation:shimmer 1.4s infinite;}
  @keyframes shimmer{to{transform:translateX(100%);}}
</style>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js");}</script>
</head>
<body>
<header>
  <div class="ttl" style="display:flex;align-items:center;gap:10px"><img src="logo.png" alt="" style="width:38px;height:38px;border-radius:9px;flex:0 0 auto"><div>Datacom Field Kit<small id="hdrsub">Projects</small><div class="mut" id="syncstat" style="font-size:.75rem;line-height:1.3"></div></div></div>
  <div class="hdrmenu"><button class="hbtn" id="btnMore" aria-label="More options">&#8942;</button>
    <div class="cmenu" id="hdrMenu" style="display:none"></div></div>
</header>
<aside id="deskSide"></aside>
<div id="timerbar"></div>
<main id="app"></main>
<div id="toast"></div>
<nav id="tabbar"></nav>

// One row per user in running_timers: start upserts, stop deletes, and a
// launch fetch restores the timer on any device (cross-device timers, F6).
function pushTimerRow(){
  if(!sb||!sbUser) return Promise.resolve();
  if(!data.timer)
    return sb.from('running_timers').delete().eq('user_id',sbUser.id).then(function(){},function(){});
  return sb.from('running_timers').upsert(
    {user_id:sbUser.id,project_id:data.timer.projectId,kind:data.timer.kind,started_at:data.timer.startISO},
    {onConflict:'user_id'}).then(function(){},function(){});
}
function loadOwnTimer(){
  if(!sb||!sbUser) return Promise.resolve();
  return sb.from('running_timers').select('*').eq('user_id',sbUser.id).maybeSingle().then(function(r){
    if(r.error||!r.data){ data.timer=null; return; }
    var row=r.data;
    if(!projById(row.project_id)){
      // Its project is gone: drop the orphan row, do not resurrect the timer.
      data.timer=null;
      sb.from('running_timers').delete().eq('user_id',sbUser.id).then(function(){},function(){});
      return;
    }
    data.timer={projectId:row.project_id,kind:row.kind,startISO:row.started_at};
  }).catch(function(){});
}
function onTimerRowChanged(){
  // Own row changed (started/stopped on another device) or, for admins,
  // any crew row changed: refetch and update the bar + dashboard block.
  loadOwnTimer().then(function(){
    if(isAdmin) return loadCrewTimers();
  }).then(function(){
    renderTimerBar();
    if((view.name==='dashboard'||view.name==='admin')&&!uiBusy()) render();
  });
}
function startTimer(pid,kind){
  if(data.timer){toast('A timer is already running — stop it first');return;}
  data.timer={projectId:pid,kind:kind,startISO:new Date().toISOString()};save();pushTimerRow();render();
  toast('Timer started ('+kind+')');}
function snap15(d){ return new Date(Math.round(d.getTime()/900000)*900000); }
function snapRange(start,end){
  var s=snap15(start),e=snap15(end);
  if(e<=s)e=new Date(s.getTime()+15*60000);
  return [s,e];}
function fmtClock(d){ return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}); }
function stopTimer(){
  if(!data.timer)return;
  var r=snapRange(new Date(data.timer.startISO),new Date());
  var entry={id:uid(),projectId:data.timer.projectId,kind:data.timer.kind,
    startISO:toLocalInput(r[0]),endISO:toLocalInput(r[1]),notes:'',source:'timer',userId:(sbUser?sbUser.id:'')};
  data.timeEntries.push(entry);
  data.timer=null;save();pushTimerRow();render();
  openStopDialog(entry.id);}
var stopDlgId=null;
function openStopDialog(id){
  var e=data.timeEntries.filter(function(x){return x.id===id;})[0]; if(!e)return;
  var p=projById(e.projectId); stopDlgId=id;
  var ov=document.createElement('div'); ov.className='dlg-ov'; ov.id='stopDlg';
  ov.innerHTML='<div class="dlg"><div class="cardhd"><h3>Time entry</h3><button class="dlg-x" aria-label="Close" onclick="closeStopDialog()">\u00d7</button></div>'
    +'<p class="mut" style="margin:2px 0 12px">'+esc(p?p.name:'?')+' \u00b7 '+esc(e.kind)+' \u00b7 '+fmtClock(new Date(e.startISO))+'\u2013'+fmtClock(new Date(e.endISO))+' ('+fmtHM(entryMinutes(e))+')</p>'
    +'<label>Notes</label><textarea id="sd_notes" rows="3" placeholder="What did you work on?">'+esc(e.notes||'')+'</textarea>'
    +'<div class="row" style="margin-top:12px"><div><label>Start</label><input id="sd_start" type="time" value="'+e.startISO.slice(11,16)+'"></div><div><label>End</label><input id="sd_end" type="time" value="'+e.endISO.slice(11,16)+'"></div></div>'
    +'<div style="margin-top:12px"><label>Lunch deduction (hours)</label><div class="seg" id="sd_lunch_seg"><button class="act" data-min="0" onclick="stopLunchPick(this)">0</button><button data-min="15" onclick="stopLunchPick(this)">0.25</button><button data-min="30" onclick="stopLunchPick(this)">0.5</button><button data-min="45" onclick="stopLunchPick(this)">0.75</button><button data-min="60" onclick="stopLunchPick(this)">1</button></div></div>'
    +'<button class="btn" style="width:100%;margin-top:16px" onclick="stopDialogSave()">Save</button>'
    +'<button class="btn sec" style="width:100%;margin-top:8px" onclick="closeStopDialog()">Keep as-is</button></div>';
  ov.addEventListener('click',function(ev){ if(ev.target===ov) closeStopDialog(); });
  document.body.appendChild(ov);
}
function stopLunchPick(btn){
  var seg=document.getElementById('sd_lunch_seg'); if(!seg) return;
  seg.querySelectorAll('button').forEach(function(b){ b.classList.remove('act'); });
  btn.classList.add('act');
}
function stopDialogSave(){
  var e=stopDlgId?data.timeEntries.filter(function(x){return x.id===stopDlgId;})[0]:null; if(!e)return;
  var s=val('sd_start'),en=val('sd_end');
  if(!s||!en||en<=s){toast('End must be after start');return;}
  var day=e.startISO.slice(0,10);
  var gross=(new Date(day+'T'+en).getTime()-new Date(day+'T'+s).getTime())/60000;
  var seg=document.querySelector('#sd_lunch_seg .act');
  var lunch=Math.max(0,parseInt(seg?seg.getAttribute('data-min'):'0',10)||0);
  if(lunch>=gross){toast('Lunch must be shorter than the entry');return;}
  e.startISO=day+'T'+s; e.endISO=day+'T'+en; e.notes=val('sd_notes'); e.lunchMin=lunch;
  save(); closeStopDialog(); render();
}
function closeStopDialog(){
  var o=document.getElementById('stopDlg'); if(o) o.remove();
  var e=stopDlgId?data.timeEntries.filter(function(x){return x.id===stopDlgId;})[0]:null; stopDlgId=null;
  if(e) toast('Time entry saved ('+fmtHM(entryMinutes(e))+', '+fmtClock(new Date(e.startISO))+'\u2013'+fmtClock(new Date(e.endISO))+')');
}

  else crewTimers.forEach(function(t){
    var p=projById(t.project_id);
    var mins=Math.max(0,Math.floor((Date.now()-new Date(t.started_at).getTime())/60000));
    h+='<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0"><span><b>'+esc(authorLabels[t.user_id]||'Teammate')+'</b> \u00b7 '+esc(t.kind)+' \u00b7 '+esc(p?p.name:'?')+'</span><span class="mut" style="white-space:nowrap">'+fmtHM(mins)+'</span></div>';
  });

function pruneLocalProject(id){
  // Remove a project and all its local data without touching the server.
  // Used when an admin purge (here or on another device) deletes it.
  data.projects=data.projects.filter(function(p){return p.id!==id;});
  data.timeEntries=data.timeEntries.filter(function(e){return e.projectId!==id;});
  data.pulls=data.pulls.filter(function(x){return x.projectId!==id;});
  data.materials=data.materials.filter(function(x){return x.projectId!==id;});
  data.ipAssignments=data.ipAssignments.filter(function(x){return x.projectId!==id;});
  var sw=data.poeSwitches.filter(function(s){return s.projectId===id;}).map(function(s){return s.id;});
  data.poeDevices=data.poeDevices.filter(function(d){return sw.indexOf(d.switchId)<0;});
  data.poeSwitches=data.poeSwitches.filter(function(s){return s.projectId!==id;});
  var pw=data.portSwitches.filter(function(s){return s.projectId===id;}).map(function(s){return s.id;});
  data.portEntries=data.portEntries.filter(function(d){return pw.indexOf(d.switchId)<0;});
  data.portSwitches=data.portSwitches.filter(function(s){return s.projectId!==id;});
  delete data.storageCalcs[id];delete data.ipSubnets[id];
  if(data.timer&&data.timer.projectId===id)data.timer=null;
}
function delProject(id){
  var _p=projById(id);
  var _mine=!_p||!_p.owner_id||!sbUser||_p.owner_id===sbUser.id;
  if(!confirm(_mine
    ?'Delete this project and ALL its data (time, pulls, materials, etc.)?'
    :'Leave this project? It is removed from your device only \u2014 the project and its data stay with the owner.'))return;
  data.projects=data.projects.filter(function(p){return p.id!==id;});
  data.timeEntries=data.timeEntries.filter(function(e){return e.projectId!==id;});
  data.pulls=data.pulls.filter(function(x){return x.projectId!==id;});
  data.materials=data.materials.filter(function(x){return x.projectId!==id;});
  data.ipAssignments=data.ipAssignments.filter(function(x){return x.projectId!==id;});
  var sw=data.poeSwitches.filter(function(s){return s.projectId===id;}).map(function(s){return s.id;});
  data.poeDevices=data.poeDevices.filter(function(d){return sw.indexOf(d.switchId)<0;});
  data.poeSwitches=data.poeSwitches.filter(function(s){return s.projectId!==id;});
  var pw=data.portSwitches.filter(function(s){return s.projectId===id;}).map(function(s){return s.id;});
  data.portEntries=data.portEntries.filter(function(d){return pw.indexOf(d.switchId)<0;});
  data.portSwitches=data.portSwitches.filter(function(s){return s.projectId!==id;});
  delete data.storageCalcs[id];delete data.ipSubnets[id];
  if(data.timer&&data.timer.projectId===id)data.timer=null;
  save();goProjects();toast(_mine?'Project deleted':'Left project');}
function exportProject(id){
  var p=projById(id);if(!p)return;
  var swIds=data.poeSwitches.filter(function(s){return s.projectId===id;}).map(function(s){return s.id;});
  var ptIds=data.portSwitches.filter(function(s){return s.projectId===id;}).map(function(s){return s.id;});
  var pack={app:'datacom-field-kit',kind:'project-export',version:1,exportedAt:new Date().toISOString(),
    project:p,
    timeEntries:data.timeEntries.filter(function(e){return e.projectId===id;}),
    pulls:data.pulls.filter(function(x){return x.projectId===id;}),
    materials:data.materials.filter(function(m){return m.projectId===id;}),
    ipAssignments:data.ipAssignments.filter(function(x){return x.projectId===id;}),
    ipSubnets:data.ipSubnets?data.ipSubnets[id]:undefined,
    storageCalcs:data.storageCalcs?data.storageCalcs[id]:undefined,
    poeSwitches:data.poeSwitches.filter(function(s){return s.projectId===id;}),
    poeDevices:data.poeDevices.filter(function(d){return swIds.indexOf(d.switchId)>=0;}),
    portSwitches:data.portSwitches.filter(function(s){return s.projectId===id;}),
    portEntries:data.portEntries.filter(function(d){return ptIds.indexOf(d.switchId)>=0;})};
  var slug=String(p.name||'project').replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'').toLowerCase()||'project';
  saveFile('fieldkit-'+slug+'.json',JSON.stringify(pack,null,2));}
function importProjectFile(){
  var fi=$('ip_file'),f=fi&&fi.files[0];
  if(!f){$('ip_msg').innerHTML='<div class="err">Choose a project file first.</div>';return;}
  var r=new FileReader();
  r.onload=function(){
    try{
      var pack=JSON.parse(r.result);
      if(!pack||pack.kind!=='project-export'||!pack.project||!pack.project.id)
        throw new Error('Not a Field Kit project export');
      var p=JSON.parse(JSON.stringify(pack.project));
      // Imports are ALWAYS fresh copies with new ids: keeping the source
      // ids collides with the original's server rows (or its tombstone)
      // and wedges sync for anyone who is not a member of the original.
      var copy=true;
      var newPid=uid();
      p.id=newPid; delete p.owner_id;
      if(p.createdAt===undefined)p.createdAt=Date.now();
      data.projects.push(p);
      var swMap={};
      function pushUnique(arr,x){
        if(x.id&&arr.some(function(y){return y.id===x.id;}))return;
        arr.push(x);}
      function clone(x){return JSON.parse(JSON.stringify(x));}
      [['timeEntries','projectId'],['pulls','projectId'],['materials','projectId'],['ipAssignments','projectId']]
        .forEach(function(cfg){
          (pack[cfg[0]]||[]).forEach(function(x){var c=clone(x);c.projectId=newPid;
            if(copy)c.id=uid();pushUnique(data[cfg[0]],c);});});
      (pack.poeSwitches||[]).forEach(function(s){var c=clone(s);
        if(copy){c.id=uid();swMap[s.id]=c.id;}c.projectId=newPid;pushUnique(data.poeSwitches,c);});
      (pack.poeDevices||[]).forEach(function(d){var c=clone(d);
        if(copy){c.id=uid();if(swMap[d.switchId])c.switchId=swMap[d.switchId];}pushUnique(data.poeDevices,c);});
      (pack.portSwitches||[]).forEach(function(s){var c=clone(s);
        if(copy){c.id=uid();swMap[s.id]=c.id;}c.projectId=newPid;pushUnique(data.portSwitches,c);});
      (pack.portEntries||[]).forEach(function(d){var c=clone(d);
        if(copy){c.id=uid();if(swMap[d.switchId])c.switchId=swMap[d.switchId];}pushUnique(data.portEntries,c);});
      if(pack.ipSubnets!==undefined){if(!data.ipSubnets)data.ipSubnets={};data.ipSubnets[newPid]=pack.ipSubnets;}
      if(pack.storageCalcs!==undefined){if(!data.storageCalcs)data.storageCalcs={};data.storageCalcs[newPid]=pack.storageCalcs;}
      save();render();
      toast(copy?'Project imported as a copy':'Project imported');
    }catch(e){$('ip_msg').innerHTML='<div class="err">Import failed: '+esc(e.message)+'</div>';}
  };
  r.readAsText(f);}

function modMetric(p,id){

  if(id==='poe')return data.poeSwitches.filter(function(s){return s.projectId===p.id;}).length+' switches';
  if(id==='subnet')return data.ipAssignments.filter(function(a){return a.projectId===p.id;}).length+' IPs assigned';

    +tileIds.map(function(id){

        +'<div style="font-weight:700;margin-top:9px">'+esc(lbl?lbl[1]:id)+'</div>'
        +(met?'<div class="mut" style="font-size:.8rem;margin-top:2px">'+esc(met)+'</div>':'')
        +'</button>';}).join('')+'</div>';
  var ev=[];
  data.timeEntries.forEach(function(e){ if(e.projectId!==p.id)return; var t=new Date(e.startISO).getTime(); ev.push({t:isFinite(t)?t:0,type:'time',e:e}); });
  data.pulls.forEach(function(x){ if(x.projectId!==p.id)return; var t=x.createdAt||(x.date?new Date(x.date+'T12:00:00').getTime():0); ev.push({t:isFinite(t)?t:0,type:'pull',e:x}); });
  data.materials.forEach(function(m){ if(m.projectId!==p.id)return; ev.push({t:m.createdAt||0,type:'mat',e:m}); });
  ev.sort(function(a,b){return b.t-a.t;}); ev=ev.slice(0,5);
  h+='<div class="card"><div class="cardhd"><h3>Recent on this project</h3></div>';

function openModuleDialog(){

function closeModuleDialog(){var o=document.getElementById('modDlg');if(o)o.remove();}
function techList(p){if(!p.technicians)p.technicians=[];return p.technicians;}
var memberCache={};
var PROJ_COLORS=['#2dd4bf','#fb923c','#f472b6','#7c8cff'];
function projColor(p){
  var id=(p&&p.id)||''; var h=0;
  for(var i=0;i<id.length;i++){ h=(h*31+id.charCodeAt(i))>>>0; }
  return PROJ_COLORS[h%PROJ_COLORS.length];
}
function tbadge(label,color){
  return '<span class="tbadge" style="background:'+color+'">'+label+'</span>';
}
function cwTag(p){ return p&&p.ticket?' <span class="tbadge" style="background:#1d5c96">CW #'+esc(p.ticket)+'</span>':''; }
function cwSuffix(p){ return p&&p.ticket?' \u00b7 CW #'+esc(p.ticket):''; }
function profLabel(pr){ if(!pr) return ''; var n=String(pr.display_name||'').trim(); return n||pr.email||''; }
var authorLabels={};
function entryAuthorName(p,e){
  if(!p||!e||!e.userId) return '';
  var mc=memberCache[p.id];
  if(mc&&mc.labels&&mc.labels[e.userId]) return mc.labels[e.userId];
  return authorLabels[e.userId]||'';
}
function canEditEntry(p,e){
  if(!e||!e.userId) return true;
  if(!sbUser) return true;
  if(e.userId===sbUser.id) return true;
  return !!(p&&p.owner_id&&p.owner_id===sbUser.id);
}
function profilesQ(ids,orderEmail){
  function build(cols){ var q=sb.from('profiles').select(cols); if(ids)q=q.in('id',ids); if(orderEmail)q=q.order('email'); return q; }
  return build('id,email,display_name').then(function(r){
    if(!r.error) return r;
    return build('id,email');
  });
}
function loadMembers(pid,force){
  var p=projById(pid); if(!p||!sb||!sbUser) return;
  var c=memberCache[pid];
  if(c&&c.loading) return;
  if(c&&!c.failed&&!force) return;
  memberCache[pid]={loading:true};
  sb.from('project_members').select('user_id').eq('project_id',pid).then(function(r){
    if(r.error){ memberCache[pid]={failed:true}; if(view.name==='project'&&view.id===pid)render(); return; }
    var ids=(r.data||[]).map(function(m){return m.user_id;});
    var ownerId=p.owner_id||sbUser.id;
    data.timeEntries.forEach(function(e){ if(e.projectId===pid&&e.userId&&e.userId!==ownerId&&ids.indexOf(e.userId)<0) ids.push(e.userId); });
    profilesQ(ids.concat([ownerId])).then(function(r2){
      var labels={}; (r2.data||[]).forEach(function(pr){labels[pr.id]=profLabel(pr); authorLabels[pr.id]=labels[pr.id];});
      memberCache[pid]={labels:labels,ownerId:ownerId,ownerLabel:labels[ownerId]||'you',
        members:(r.data||[]).filter(function(m){return m.user_id!==ownerId;})
          .map(function(m){return{id:m.user_id,label:labels[m.user_id]||String(m.user_id).slice(0,8)+'…'};})};
      if(view.name==='project'&&view.id===pid)render();
    });
  });
}
function techCardHTML(p){
  var mc=memberCache[p.id];
  var h='<div class="card"><div class="cardhd"><h3>Technicians</h3></div>';
  var shown=false;
  if(mc&&!mc.loading&&!mc.failed){
    h+='<div class="kv"><span>'+esc(mc.ownerLabel||mc.ownerEmail||'')+'</span>'+tbadge('owner','#1d5c96')+'</div>';
    mc.members.forEach(function(m){
      h+='<div class="kv"><span>'+esc(m.label||m.email||'')+'</span>'+tbadge('member','#2a4a63')+'</div>';
    });
    shown=true;
  }
  if(!shown) h+=((sb&&sbUser)?'<p class="mut">Loading members…</p>':'<p class="mut">Sign in to see project members.</p>');
  h+='<p class="mut" style="font-size:.75rem;margin:8px 0 0">Members are managed via \u22ee \u2192 Share project</p>';
  return h+'</div>';}
function toggleModule(mod,on){
  var p=projById(view.id);if(!p)return;
  if(ALWAYS_ON.indexOf(mod)>=0)return;
  var mods=enabledMods(p).slice();
  if(on&&mods.indexOf(mod)<0)mods.push(mod);
  if(!on)mods=mods.filter(function(m){return m!==mod;});
  p.enabledModules=mods;save();
  if(!on&&curTab===mod)curTab='overview';
  render();}
function toggleProjStatus(){var p=projById(view.id);p.status=p.status==='done'?'active':'done';save();render();}
function editProjectForm(){
  var p=projById(view.id);
  $('editProj').innerHTML='<div style="margin-top:12px"><label>Name</label><input id="ep_name" value="'+esc(p.name)+'">'
    +'<div class="row"><div><label>Customer</label><input id="ep_customer" value="'+esc(p.customer||'')+'"></div>'
    +'<div><label>Site</label><input id="ep_site" value="'+esc(p.site||'')+'"></div></div>'
    +'<label>ConnectWise ticket #</label><input id="ep_ticket" value="'+esc(p.ticket||'')+'">'
    +'<label>Notes</label><textarea id="ep_notes">'+esc(p.notes||'')+'</textarea>'
    +'<button class="btn grn" onclick="saveProjectEdit()">Save changes</button></div>';}
function saveProjectEdit(){var p=projById(view.id);
  p.name=val('ep_name')||p.name;p.customer=val('ep_customer');p.site=val('ep_site');
  p.ticket=val('ep_ticket');p.notes=val('ep_notes');save();render();toast('Project updated');}
/* ============ TIME TAB ============ */
var teEditId=null;
function modHero(p,label,metric){
  return '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 2px 12px">'
    +'<div style="font-size:1.3rem;font-weight:800">'+esc(label)+'</div>'
    +(metric?'<div style="color:'+projColor(p)+';font-weight:700;font-size:1.05rem;white-space:nowrap">'+esc(metric)+'</div>':'')
    +'</div>';
}
function timeHTML(p){
  var running=data.timer&&data.timer.projectId===p.id;
  var h=modHero(p,'Time',fmtHM(projectMinutes(p.id)))+'<div class="card"><h3>Timer</h3>';
  if(data.timer){
    h+='<p class="mut">A timer is running ('+esc(data.timer.kind)+' on '
      +esc((projById(data.timer.projectId)||{}).name||'another project')+'). Stop it from the bar at the top.</p>';
  }else{
    h+='<label>Kind</label><div class="seg" id="tkSeg">'
      +KINDS.map(function(k,i){return '<button type="button" data-k="'+k+'" class="'+(i===1?'act':'')+'" onclick="segPick(\'tkSeg\',this)">'+k+'</button>';}).join('')+'</div>'
      +'<button class="btn grn" onclick="startTimer(view.id,segVal(\'tkSeg\'))">Start timer</button>';
  }
  h+='</div>';
  h+='<div class="card"><h3>'+(teEditId?'Edit entry':'Add manual entry')+'</h3>'
    +'<label>Date</label><input id="te_date" type="date">'
    +'<div class="row"><div><label>Start</label><input id="te_start" type="time"></div>'
    +'<div><label>End</label><input id="te_end" type="time"></div></div>'
    +'<label>Kind</label><div class="seg" id="teSeg">'
    +KINDS.map(function(k,i){return '<button type="button" data-k="'+k+'" class="'+(i===1?'act':'')+'" onclick="segPick(\'teSeg\',this)">'+k+'</button>';}).join('')+'</div>'
    +'<label>Notes</label><textarea id="te_notes" rows="2" placeholder="What was done" oninput="autoGrow(this)"></textarea>'
    +'<label style="font-weight:700;color:var(--text);margin-top:12px">Deductions</label>'
    +'<label>Lunch (minutes)</label><input id="te_lunch" type="number" inputmode="numeric" min="0" placeholder="0">'
    +'<button class="btn" onclick="saveTimeEntry()">'+(teEditId?'Save changes':'Add entry')+'</button>'
    +(teEditId?'<button class="btn sec" style="margin-top:8px" onclick="teEditId=null;render()">Cancel edit</button>':'')
    +'</div>';
  var entries=data.timeEntries.filter(function(e){return e.projectId===p.id;})
    .sort(function(a,b){return a.startISO<b.startISO?1:-1;});
  h+='<div class="card"><h3>Entries</h3>';
  if(!entries.length)h+='<p class="mut">No time entries yet.</p>';
  var byDay={};entries.forEach(function(e){var d=e.startISO.slice(0,10);(byDay[d]=byDay[d]||[]).push(e);});
  Object.keys(byDay).sort().reverse().forEach(function(d){
    var dayMin=0,kindMin={};
    byDay[d].forEach(function(e){var m=entryMinutes(e);dayMin+=m;kindMin[e.kind]=(kindMin[e.kind]||0)+m;});
    h+='<h4>'+esc(d)+' — '+fmtHM(dayMin)+'</h4><div class="mut" style="margin-bottom:6px">'
      +Object.keys(kindMin).map(function(k){return esc(k)+': '+fmtHM(kindMin[k]);}).join(' · ')+'</div>';
    byDay[d].forEach(function(e){
      var an=entryAuthorName(p,e),ce=canEditEntry(p,e);
      h+='<div class="kv"><span>'+esc(e.startISO.slice(11,16))+'–'+esc(e.endISO.slice(11,16))
        +' · '+esc(e.kind)+(an?' · <span class="mut">'+esc(an)+'</span>':'')+(e.updatedBy&&e.updatedBy!==e.userId?' · <span class="mut">edited by '+esc(authorLabels[e.updatedBy]||'teammate')+'</span>':'')+((e.notes||e.lunchMin)?'<br><span class="mut">'+(e.notes?esc(e.notes):'')+(e.notes&&e.lunchMin?' · ':'')+(e.lunchMin?'lunch '+e.lunchMin+' min':'')+'</span>':'')+'</span>'
        +'<span style="white-space:nowrap"><b>'+fmtHM(entryMinutes(e))+'</b>'
        +(ce?'<button class="edt" onclick="editTimeEntry(\''+e.id+'\')">Edit</button>'
        +'<button class="del" onclick="delTimeEntry(\''+e.id+'\')">Del</button>':'')+'</span></div>';});
  });
  h+='</div>';
  return h;
}
function segPick(id,btn){var seg=$(id);Array.prototype.forEach.call(seg.children,function(c){c.className='';});
  btn.className='act';}
function autoGrow(el){if(!el)return;el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';}
function segVal(id){var seg=$(id);for(var i=0;i<seg.children.length;i++)
  if(seg.children[i].className==='act')return seg.children[i].getAttribute('data-k');return KINDS[0];}
function saveTimeEntry(){
  var d=val('te_date'),s=val('te_start'),e=val('te_end');
  if(!d||!s||!e){toast('Date, start and end are required');return;}
  var start=d+'T'+s,end=d+'T'+e;
  if(new Date(end)<=new Date(start)){toast('End must be after start');return;}
  var sr=snapRange(new Date(start),new Date(end));
  start=toLocalInput(sr[0]);end=toLocalInput(sr[1]);
  var kind=segVal('teSeg'),notes=val('te_notes');
  var lunch=Math.max(0,parseInt(val('te_lunch'),10)||0);
  if(lunch>=(sr[1]-sr[0])/60000){toast('Lunch must be shorter than the entry');return;}
  if(teEditId){var en=data.timeEntries.filter(function(x){return x.id===teEditId;})[0];
    if(en&&!canEditEntry(projById(en.projectId),en)){toast('You can only edit your own entries');return;}
    if(en){en.startISO=start;en.endISO=end;en.kind=kind;en.notes=notes;en.lunchMin=lunch;}teEditId=null;}
  else data.timeEntries.push({id:uid(),projectId:view.id,kind:kind,startISO:start,endISO:end,
    notes:notes,source:'manual',userId:(sbUser?sbUser.id:''),lunchMin:lunch});
  save();render();toast('Entry saved ('+fmtClock(sr[0])+'\u2013'+fmtClock(sr[1])+')');}
function editTimeEntry(id){var e=data.timeEntries.filter(function(x){return x.id===id;})[0];if(!e)return;
  if(!canEditEntry(projById(e.projectId),e)){toast('You can only edit your own entries');return;}
  teEditId=id;render();
  $('te_date').value=e.startISO.slice(0,10);$('te_start').value=e.startISO.slice(11,16);
  $('te_end').value=e.endISO.slice(11,16);$('te_notes').value=e.notes||'';autoGrow($('te_notes'));
  var lf=$('te_lunch'); if(lf) lf.value=e.lunchMin||'';
  var seg=$('teSeg');Array.prototype.forEach.call(seg.children,function(c){
    c.className=c.getAttribute('data-k')===e.kind?'act':'';});
  window.scrollTo(0,0);}
function delTimeEntry(id){var e=data.timeEntries.filter(function(x){return x.id===id;})[0];
  if(e&&!canEditEntry(projById(e.projectId),e)){toast('You can only delete your own entries');return;}
  if(!confirm('Delete this time entry?'))return;
  data.timeEntries=data.timeEntries.filter(function(e){return e.id!==id;});save();render();}
</script>

<script>
/* ============ CABLE TAB ============ */
var pullMode='range';
function cableHTML(p){
  var boxes={};
  data.pulls.filter(function(x){return x.projectId===p.id;}).forEach(function(x){
    var key=x.box||'Box 1';
    if(!boxes[key])boxes[key]={size:Number(x.boxSize)||1000,used:0,rows:[]};
    boxes[key].used+=Number(x.used)||0;boxes[key].rows.push(x);});
  var boxNames=Object.keys(boxes);
  var h=modHero(p,'Cable',projectCableFt(p.id)+' ft')+'<div class="card"><h3>Add cable pull</h3>'
    +'<div class="row"><div><label>Cable type</label><select id="cp_run">'
    +cableTypeList().map(function(t){return '<option>'+esc(t)+'</option>';}).join('')+'</select></div>'
    +'<div><label>Cable Color</label><select id="cp_box">'
    +cableColorList().map(function(c){return '<option>'+esc(c)+'</option>';}).join('')+'</select></div></div>'
    +'<label>Box size (ft)</label><input id="cp_size" type="number" inputmode="decimal" value="1000">'
    +'<label>Markings on the box</label><div class="seg">'
    +'<button type="button" id="pm_range" class="'+(pullMode==='range'?'act':'')+'" onclick="setPullMode(\'range\')">Previous + newest</button>'
    +'<button type="button" id="pm_single" class="'+(pullMode==='single'?'act':'')+'" onclick="setPullMode(\'single\')">Single marking</button></div>'
    +'<div id="pm_range_fields" style="display:'+(pullMode==='range'?'block':'none')+'">'
    +'<div class="row"><div><label>Previous number (ft)</label><input id="cp_prev" type="number" inputmode="decimal"></div>'
    +'<div><label>Newest number (ft)</label><input id="cp_new" type="number" inputmode="decimal"></div></div>'
    +'<p class="mut">Used = previous − newest.</p></div>'
    +'<div id="pm_single_fields" style="display:'+(pullMode==='single'?'block':'none')+'">'
    +'<label>Marking (ft remaining on box)</label><input id="cp_mark" type="number" inputmode="decimal">'
    +'<p class="mut">Used = box size − marking.</p></div>'
    +'<div id="cp_err"></div>'
    +'<button class="btn" onclick="addPull()">Add pull</button></div>';
  h+='<div class="card"><h3>Pulls on this job</h3>';
  if(!boxNames.length)h+='<p class="mut">No pulls logged yet.</p>';
  boxNames.forEach(function(b){
    var bx=boxes[b];
    h+='<h4>'+esc(b)+' — '+bx.used+' ft used · '+Math.max(0,bx.size-bx.used)+' ft left of '+bx.size+'</h4>';
    h+='<table><tr><th>Cable type</th><th>Markings</th><th>Used</th><th></th></tr>';
    bx.rows.forEach(function(x){
      var mk=x.mode==='single'?('single '+x.marking):(x.prev+' → '+x.newest);
      h+='<tr><td>'+esc(x.run||'')+'</td><td>'+esc(mk)+'</td><td><b>'+x.used+' ft</b></td>'
        +'<td><button class="del" onclick="delPull(\''+x.id+'\')">Del</button></td></tr>';});
    h+='</table>';});
  h+='<div class="kv" style="margin-top:8px"><span class="mut">Project total</span><b>'+projectCableFt(p.id)+' ft</b></div></div>';
  return h;
}
function setPullMode(m){pullMode=m;
  $('pm_range').className=m==='range'?'act':'';$('pm_single').className=m==='single'?'act':'';
  $('pm_range_fields').style.display=m==='range'?'block':'none';
  $('pm_single_fields').style.display=m==='single'?'block':'none';}
function addPull(){
  var size=num('cp_size')||1000,err='';
  var used,prev=null,newest=null,marking=null;
  if(pullMode==='range'){
    prev=parseFloat(val('cp_prev'));newest=parseFloat(val('cp_new'));
    if(!isFinite(prev)||!isFinite(newest))err='Enter both the previous and newest markings.';
    else if(prev<0||prev>size||newest<0||newest>size)err='Markings must be between 0 and the box size ('+size+' ft).';
    else{used=FK.cableUsed(prev,newest,size);if(used<=0)err='Used footage must be more than 0 — check the markings.';}
  }else{
    marking=parseFloat(val('cp_mark'));
    if(!isFinite(marking))err='Enter the single marking.';
    else if(marking<0||marking>size)err='Marking must be between 0 and the box size ('+size+' ft).';
    else{used=FK.cableUsed(marking,null,size);if(used<=0)err='Used footage must be more than 0 — check the marking.';}
  }
  if(err){$('cp_err').innerHTML='<div class="err">'+esc(err)+'</div>';return;}
  data.pulls.push({id:uid(),projectId:view.id,createdAt:Date.now(),run:val('cp_run'),box:val('cp_box')||'Box 1',
    boxSize:size,mode:pullMode,prev:prev,newest:newest,marking:marking,used:used,date:todayStr()});
  save();render();toast('Pull added — '+used+' ft');}
function delPull(id){if(!confirm('Delete this pull?'))return;
  data.pulls=data.pulls.filter(function(x){return x.id!==id;});save();render();}
/* ============ STORAGE TAB ============ */
var ST_PRESETS=[['1080p',4],['4MP',8],['5MP',10],['4K',16]];
function storageHTML(p){
  var s=data.storageCalcs[p.id]||{cameras:16,bitrate:4,hours:24,days:30,availTB:''};
  var h=modHero(p,'Camera storage','')+'<div class="card"><h3>Camera storage calculator</h3>'
    +'<div class="row"><div><label>Cameras</label><input id="st_cams" type="number" inputmode="numeric" value="'+esc(s.cameras)+'" oninput="storageRecalc(curProj())"></div>'
    +'<div><label>Bitrate per camera (Mbps)</label><input id="st_bit" type="number" inputmode="decimal" value="'+esc(s.bitrate)+'" oninput="storageRecalc(curProj())"></div></div>'
    +'<div class="seg">'+ST_PRESETS.map(function(pr){
      return '<button type="button" class="preset" onclick="$(\'st_bit\').value='+pr[1]+';storageRecalc(curProj())">'+pr[0]+' ≈ '+pr[1]+'</button>';}).join('')+'</div>'
    +'<div class="row"><div><label>Recording hours / day</label><input id="st_hours" type="number" inputmode="decimal" value="'+esc(s.hours)+'" oninput="storageRecalc(curProj())"></div>'
    +'<div><label>Retention (days)</label><input id="st_days" type="number" inputmode="decimal" value="'+esc(s.days)+'" oninput="storageRecalc(curProj())"></div></div>'
    +'<div id="st_out"></div>'
    +'<h4>Reverse — I have this much storage</h4>'
    +'<label>Available storage (TB)</label><input id="st_avail" type="number" inputmode="decimal" value="'+esc(s.availTB)+'" oninput="storageRecalc(curProj())">'
    +'<div id="st_out2"></div>'
    +'<p class="mut">Saved automatically for this project. Decimal TB (1 TB = 1000 GB), continuous recording at the set bitrate.</p></div>';
  return h;
}
function curProj(){return projById(view.id);}
function storageRecalc(p){
  if(!p||!$('st_cams'))return;
  var cams=num('st_cams'),bit=num('st_bit'),hrs=num('st_hours'),days=num('st_days'),avail=parseFloat(val('st_avail'));
  var tb=FK.storageTB(cams,bit,hrs,days);
  $('st_out').innerHTML='<div class="ok">Storage needed: <b>'+tb.toFixed(2)+' TB</b> for '
    +cams+' camera(s) × '+bit+' Mbps × '+hrs+' h/day × '+days+' days</div>';
  if(isFinite(avail)&&avail>0){
    var d=FK.storageDays(cams,bit,hrs,avail);
    $('st_out2').innerHTML='<div class="ok">'+avail+' TB gives about <b>'+d.toFixed(1)+' days</b> of retention at these settings.</div>';
  }else $('st_out2').innerHTML='';
  data.storageCalcs[p.id]={cameras:cams,bitrate:bit,hours:hrs,days:days,availTB:val('st_avail')};save();}
/* ============ POE TAB ============ */
var POE_PRESETS=[['Fixed camera',15],['PTZ',30],['Hi-PoE PTZ',60],['Wi-Fi AP',25],['Phone',7]];
function poeHTML(p){
  var sws=data.poeSwitches.filter(function(s){return s.projectId===p.id;});
  var DEV_COLORS=['#2dd4bf','#fb923c','#7c8cff','#f472b6'];
  var totalAll=sws.reduce(function(s,sw){return s+data.poeDevices.filter(function(d){return d.switchId===sw.id;}).reduce(function(a,d){return a+(Number(d.watts)||0)*(Number(d.qty)||0);},0);},0);
  var h=modHero(p,'PoE Budget',totalAll.toFixed(0)+' W total');
  if(!sws.length)h+='<div class="card"><p class="mut">No switches yet. Add your first switch below.</p></div>';
  sws.forEach(function(sw,swi){
    var devs=data.poeDevices.filter(function(d){return d.switchId===sw.id;});
    var total=devs.reduce(function(s,d){return s+(Number(d.watts)||0)*(Number(d.qty)||0);},0);
    var pct=sw.budget>0?Math.min(100,total/sw.budget*100):0;
    var over=total>sw.budget;
    var warn=!over&&sw.budget>0&&total/sw.budget>0.8;
    var maxDev=devs.reduce(function(m,d){return Math.max(m,(Number(d.watts)||0)*(Number(d.qty)||0));},0);
    h+='<div class="card" style="padding-top:0;overflow:hidden">'
      +'<div style="height:10px;background:var(--pnk);margin:0 -14px 14px"></div>'
      +'<div class="proj-head"><div class="grow"><h3 style="font-size:1.2rem">'+esc(sw.name)+'</h3>'
      +'<div class="mut">PoE budget '+sw.budget+' W</div></div>'
      +'<button class="del" onclick="delPoeSwitch(\''+sw.id+'\')">Delete</button></div>'
      +'<div style="margin:10px 0 2px"><span style="font-size:2.1rem;font-weight:800">'+total.toFixed(0)+' W</span>'
      +' <span class="mut">of '+sw.budget+' W budget</span></div>'
      +'<div class="bar" style="height:16px;border-radius:8px"><i style="width:'+pct+'%;background:'+(over?'var(--red)':warn?'var(--amber)':'var(--pnk)')+'"></i></div>'
      +'<div class="mut" style="margin-top:7px">'+(sw.budget>0?(total/sw.budget*100).toFixed(0):'—')+'% used · '+(over?'<span style="color:var(--red)">over by '+(total-sw.budget).toFixed(0)+' W</span>':(sw.budget-total).toFixed(0)+' W headroom')+'</div>'
      +(over?'<div class="err">Over budget by '+(total-sw.budget).toFixed(1)+' W.</div>'
        :(warn?'<div class="err" style="background:#3a2f07;border-color:var(--amber);color:#ffe1a8">Over 80% of budget — check headroom.</div>'
        :'<div style="margin-top:8px"><span class="tbadge" style="background:#14302a;color:#7ce7b0">✓ Within budget</span></div>'))
      +(devs.length?'<div class="seclbl">Devices on this switch</div>':'')
      +devs.map(function(d,di){
        var dt=(Number(d.watts)||0)*(Number(d.qty)||0);
        var dc=DEV_COLORS[di%DEV_COLORS.length];
        return '<div style="padding:9px 0;border-bottom:1px solid var(--line)">'
          +'<div style="display:flex;align-items:center;gap:10px"><span style="width:11px;height:11px;border-radius:50%;background:'+dc+';flex:0 0 auto"></span>'
          +'<div style="flex:1;min-width:0"><b>'+esc(d.name)+'</b><div class="mut">'+d.watts+' W × '+d.qty+'</div></div>'
          +'<b style="font-size:1.05rem">'+dt.toFixed(0)+' W</b>'
          +'<button class="del" style="padding:4px 6px;min-height:32px" onclick="delPoeDevice(\''+d.id+'\')">✕</button></div>'
          +'<div class="bar" style="height:7px;margin:7px 0 0 21px"><i style="width:'+(maxDev?Math.round(dt/maxDev*100):0)+'%;background:'+dc+'"></i></div></div>';}).join('')
      +'<h4>Add device</h4><div class="seg">'
      +POE_PRESETS.map(function(pr){return '<button type="button" class="preset" onclick="poeFill(\''+sw.id+'\',\''+pr[0]+'\','+pr[1]+')">'+pr[0]+' '+pr[1]+'W</button>';}).join('')
      +'<button type="button" class="preset" onclick="poeFill(\''+sw.id+'\',\'Custom\',\'\')">Custom</button></div>'
      +'<div class="row"><div><label>Name</label><input id="pd_name_'+sw.id+'"></div>'
      +'<div><label>Watts ea</label><input id="pd_w_'+sw.id+'" type="number" inputmode="decimal"></div>'
      +'<div><label>Qty</label><input id="pd_q_'+sw.id+'" type="number" inputmode="numeric" value="1"></div></div>'
      +'<button class="btn sec" onclick="addPoeDevice(\''+sw.id+'\')">Add device</button></div>';
  });
  h+='<div class="card"><h3>Add switch</h3>'
    +'<div class="row"><div><label>Switch name</label><input id="poe_swname" placeholder="e.g. MDF switch"></div>'
    +'<div><label>PoE budget (W)</label><input id="poe_budget" type="number" inputmode="decimal" placeholder="720"></div></div>'
    +'<div class="seg"><button type="button" onclick="$(\'poe_budget\').value=720;$(\'poe_swname\').value=$(\'poe_swname\').value||\'USW-Pro-Max-48-PoE\'">Preset: USW-Pro-Max-48-PoE · 720W</button></div>'
    +'<button class="btn" onclick="addPoeSwitch()">Add switch</button></div>';
  return h;
}
function poeFill(swId,name,w){$('pd_name_'+swId).value=name;
  if(w!=='')$('pd_w_'+swId).value=w;$('pd_q_'+swId).focus();}
function addPoeSwitch(){var name=val('poe_swname'),budget=num('poe_budget');
  if(!name){toast('Switch name required');return;}
  if(!(budget>0)){toast('Enter a PoE budget in watts');return;}
  data.poeSwitches.push({id:uid(),projectId:view.id,name:name,budget:budget});
  save();render();toast('Switch added');}
function delPoeSwitch(id){if(!confirm('Delete this switch and its devices?'))return;
  data.poeSwitches=data.poeSwitches.filter(function(s){return s.id!==id;});
  data.poeDevices=data.poeDevices.filter(function(d){return d.switchId!==id;});save();render();}
function addPoeDevice(swId){var name=val('pd_name_'+swId),w=parseFloat(val('pd_w_'+swId)),q=parseFloat(val('pd_q_'+swId));
  if(!name){toast('Device name required');return;}
  if(!isFinite(w)||w<0){toast('Enter watts per device');return;}
  if(!isFinite(q)||q<=0)q=1;
  data.poeDevices.push({id:uid(),switchId:swId,name:name,watts:w,qty:q});save();render();}
function delPoeDevice(id){data.poeDevices=data.poeDevices.filter(function(d){return d.id!==id;});save();render();}
</script>

<script>
/* ============ SUBNET + IP PLAN TAB ============ */
var ipEditId=null;
function subnetHTML(p){
  var savedSubnet=data.ipSubnets[p.id]||'';
  var rows=data.ipAssignments.filter(function(x){return x.projectId===p.id;})
    .sort(function(a,b){var x=ipToInt(a.ip),y=ipToInt(b.ip);
      return (x===null?0:x)-(y===null?0:y);});

    +'<label>Network in CIDR form</label><input id="sn_cidr" placeholder="10.40.0.0/22">'
    +'<button class="btn" onclick="calcSubnet()">Calculate</button><div id="sn_out"></div></div>';
  h+='<div class="card"><h3>IP plan — this site</h3>'
    +'<label>Site subnet</label><input id="ip_subnet" value="'+esc(savedSubnet)+'" placeholder="10.40.0.0/22" onchange="saveSiteSubnet()">'
    +'<div class="row"><button class="btn sec" onclick="nextFreeIp()">Next free IP</button>'
    +'<div id="ip_free" style="align-self:center"></div></div>'
    +'<h4>'+(ipEditId?'Edit assignment':'Add assignment')+'</h4>'
    +'<div class="row"><div><label>IP address</label><input id="ip_ip" placeholder="10.40.0.10"></div>'
    +'<div><label>Device</label><input id="ip_dev" placeholder="e.g. Cam — gym entrance"></div></div>'
    +'<label>Notes</label><input id="ip_notes">'
    +'<div id="ip_err"></div>'
    +'<button class="btn" onclick="saveIpRow()">'+(ipEditId?'Save changes':'Add assignment')+'</button>'
    +(ipEditId?'<button class="btn sec" style="margin-top:8px" onclick="ipEditId=null;render()">Cancel edit</button>':'');
  if(!rows.length)h+='<p class="mut">No IP assignments yet.</p>';
  else{
    h+='<table><tr><th>IP</th><th>Device</th><th>Notes</th><th></th></tr>'
      +rows.map(function(r){return '<tr><td><b>'+esc(r.ip)+'</b></td><td>'+esc(r.device)+'</td><td>'+esc(r.notes||'')+'</td>'
        +'<td style="white-space:nowrap"><button class="edt" onclick="editIpRow(\''+r.id+'\')">Edit</button>'
        +'<button class="del" onclick="delIpRow(\''+r.id+'\')">Del</button></td></tr>';}).join('')+'</table>';
  }
  h+='</div>';
  return h;
}
function calcSubnet(){
  try{var r=FK.subnetCalc(val('sn_cidr'));
    $('sn_out').innerHTML='<div style="margin-top:8px">'
      +'<div class="kv"><span class="mut">Network</span><b>'+r.network+'/'+r.prefix+'</b></div>'
      +'<div class="kv"><span class="mut">Broadcast</span><b>'+r.broadcast+'</b></div>'
      +'<div class="kv"><span class="mut">Netmask</span><b>'+r.netmask+'</b></div>'
      +'<div class="kv"><span class="mut">Wildcard</span><b>'+r.wildcard+'</b></div>'
      +'<div class="kv"><span class="mut">Usable range</span><b>'+r.firstUsable+' – '+r.lastUsable+'</b></div>'
      +'<div class="kv"><span class="mut">Hosts</span><b>'+r.totalHosts+' total · '+r.usableHosts+' usable</b></div></div>';
  }catch(e){$('sn_out').innerHTML='<div class="err">'+esc(e.message)+'</div>';}
}
function saveSiteSubnet(){data.ipSubnets[view.id]=val('ip_subnet');save();toast('Subnet saved');}
function nextFreeIp(){
  var sn=val('ip_subnet');
  if(!sn){$('ip_free').innerHTML='<span class="mut">Enter a site subnet first.</span>';return;}
  try{var r=FK.subnetCalc(sn);
    var used={};data.ipAssignments.filter(function(x){return x.projectId===view.id;})
      .forEach(function(x){used[x.ip]=true;});
    var first=ipToInt(r.firstUsable),last=ipToInt(r.lastUsable),found=null;
    for(var n=first;n<=last;n++){var s=intToIp(n);if(!used[s]){found=s;break;}}
    $('ip_free').innerHTML=found?('<b>'+found+'</b> is free'):'<span class="mut">Subnet is full.</span>';
    if(found)$('ip_ip').value=found;
  }catch(e){$('ip_free').innerHTML='<span class="mut">'+esc(e.message)+'</span>';}
}
function saveIpRow(){
  var ip=val('ip_ip'),dev=val('ip_dev');
  if(ipToInt(ip)===null){$('ip_err').innerHTML='<div class="err">Enter a valid IP address.</div>';return;}
  if(!dev){$('ip_err').innerHTML='<div class="err">Enter a device name.</div>';return;}
  var dup=data.ipAssignments.some(function(x){return x.projectId===view.id&&x.id!==ipEditId
    &&x.ip.toLowerCase()===ip.toLowerCase();});
  if(dup){$('ip_err').innerHTML='<div class="err">'+esc(ip)+' is already assigned on this project.</div>';return;}
  if(ipEditId){var r=data.ipAssignments.filter(function(x){return x.id===ipEditId;})[0];
    if(r){r.ip=ip;r.device=dev;r.notes=val('ip_notes');}ipEditId=null;}
  else data.ipAssignments.push({id:uid(),projectId:view.id,ip:ip,device:dev,notes:val('ip_notes')});
  save();render();toast('IP assignment saved');}
function editIpRow(id){var r=data.ipAssignments.filter(function(x){return x.id===id;})[0];if(!r)return;
  ipEditId=id;render();$('ip_ip').value=r.ip;$('ip_dev').value=r.device;$('ip_notes').value=r.notes||'';
  window.scrollTo(0,0);}
function delIpRow(id){if(!confirm('Delete this IP assignment?'))return;
  data.ipAssignments=data.ipAssignments.filter(function(x){return x.id!==id;});save();render();}
/* ============ PORTS TAB ============ */
var portEditId=null;
function portsHTML(p){
  var sws=data.portSwitches.filter(function(s){return s.projectId===p.id;});
  var h=modHero(p,'Port log',data.portEntries.filter(function(e){return e.projectId===p.id;}).length+' entries')+'<div class="card"><h3>Add switch / closet</h3>'
    +'<label>Name</label><input id="ps_name" placeholder="e.g. MDF — SW1">'
    +'<button class="btn" onclick="addPortSwitch()">Add switch</button></div>';
  if(!sws.length)h+='<div class="card"><p class="mut">No switches yet.</p></div>';
  sws.forEach(function(sw){
    var rows=data.portEntries.filter(function(e){return e.switchId===sw.id;})
      .sort(function(a,b){return (parseFloat(a.port)||0)-(parseFloat(b.port)||0);});
    h+='<div class="card"><div class="proj-head"><div class="grow"><h3>'+esc(sw.name)+'</h3></div>'
      +'<button class="del" onclick="delPortSwitch(\''+sw.id+'\')">Delete</button></div>';
    if(!rows.length)h+='<p class="mut">No ports logged.</p>';
    else h+='<table><tr><th>Port</th><th>Device</th><th>Jack</th><th>Notes</th><th></th></tr>'
      +rows.map(function(r){return '<tr><td><b>'+esc(r.port)+'</b></td><td>'+esc(r.device)+'</td><td>'+esc(r.jack||'')+'</td><td>'+esc(r.notes||'')+'</td>'
        +'<td style="white-space:nowrap"><button class="edt" onclick="editPortRow(\''+r.id+'\',\''+sw.id+'\')">Edit</button>'
        +'<button class="del" onclick="delPortRow(\''+r.id+'\')">Del</button></td></tr>';}).join('')+'</table>';
    h+='<h4>'+(portEditId&&portEditSw===sw.id?'Edit port':'Add port')+'</h4>'
      +'<div class="row"><div><label>Port</label><input id="pe_port_'+sw.id+'" placeholder="1"></div>'
      +'<div><label>Device</label><input id="pe_dev_'+sw.id+'" placeholder="Cam — gym entrance"></div>'
      +'<div><label>Jack</label><input id="pe_jack_'+sw.id+'" placeholder="PP-A12"></div></div>'
      +'<label>Notes</label><input id="pe_notes_'+sw.id+'">'
      +'<button class="btn sec" onclick="savePortRow(\''+sw.id+'\')">'
      +(portEditId&&portEditSw===sw.id?'Save changes':'Add port')+'</button></div>';
  });
  var labelText=portLabelText(p);
  h+='<div class="card"><h3>Label list</h3><textarea id="port_labels" readonly>'+esc(labelText)+'</textarea>'
    +'<div class="row"><button class="btn sec" onclick="copyText(val(\'port_labels\'))">Copy labels</button>'
    +'<button class="btn sec" onclick="saveFile(\'port-labels.txt\',val(\'port_labels\'))">Save .txt</button></div></div>';
  return h;
}
var portEditSw=null;
function portLabelText(p){
  var lines=[];
  data.portSwitches.filter(function(s){return s.projectId===p.id;}).forEach(function(sw){
    data.portEntries.filter(function(e){return e.switchId===sw.id;})
      .sort(function(a,b){return (parseFloat(a.port)||0)-(parseFloat(b.port)||0);})
      .forEach(function(r){lines.push(sw.name+' Port '+r.port+' — '+r.device+(r.jack?' — '+r.jack:''));});
  });
  return lines.join('\n')||'No ports logged yet.';
}
function addPortSwitch(){var name=val('ps_name');if(!name){toast('Switch name required');return;}
  data.portSwitches.push({id:uid(),projectId:view.id,name:name});save();render();}
function delPortSwitch(id){if(!confirm('Delete this switch and its port entries?'))return;
  data.portSwitches=data.portSwitches.filter(function(s){return s.id!==id;});
  data.portEntries=data.portEntries.filter(function(e){return e.switchId!==id;});save();render();}
function savePortRow(swId){
  var port=val('pe_port_'+swId),dev=val('pe_dev_'+swId);
  if(!port||!dev){toast('Port and device are required');return;}
  if(portEditId&&portEditSw===swId){var r=data.portEntries.filter(function(x){return x.id===portEditId;})[0];

  else data.portEntries.push({id:uid(),switchId:swId,port:port,device:dev,

function editPortRow(id,swId){var r=data.portEntries.filter(function(x){return x.id===id;})[0];if(!r)return;
  portEditId=id;portEditSw=swId;render();
  $('pe_port_'+swId).value=r.port;$('pe_dev_'+swId).value=r.device;
  $('pe_jack_'+swId).value=r.jack||'';$('pe_notes_'+swId).value=r.notes||'';}
function delPortRow(id){if(!confirm('Delete this port entry?'))return;
  data.portEntries=data.portEntries.filter(function(x){return x.id!==id;});save();render();}
/* ============ MATERIALS TAB ============ */
var matEditId=null;
var MAT_UNITS=['each','box','pack','roll','ft','other'];
function materialsHTML(p){

  var totalQty=rows.reduce(function(s,m){return s+(Number(m.qty)||0);},0);
  var h=modHero(p,'Materials',rows.length+' lines · '+totalQty+' items')+'<div class="card"><h3>'+(matEditId?'Edit material':'Add material')+'</h3>'

    +'<label>Item name</label><input id="mt_name" placeholder="e.g. Keystone jack">'

    +'<div><label>Unit</label><select id="mt_unit">'
    +MAT_UNITS.map(function(u){return '<option value="'+u+'">'+u+'</option>';}).join('')+'</select></div></div>'
    +'<label>Notes (part #, where it went)</label><input id="mt_notes">'
    +'<button class="btn" onclick="saveMaterial()">'+(matEditId?'Save changes':'Add material')+'</button>'
    +(matEditId?'<button class="btn sec" style="margin-top:8px" onclick="matEditId=null;render()">Cancel edit</button>':'')
    +'</div>';
  h+='<div class="card"><h3>Materials used</h3>';
  if(!rows.length)h+='<p class="mut">Nothing logged yet. Cable footage lives in the Cable tab — everything else the job uses goes here.</p>';
  else{
    h+='<table><tr><th>Item</th><th>Qty</th><th>Notes</th><th></th></tr>'

function matsForEntry(e){

function connectwiseNotes(p){
  var L=[];
  L.push('CONNECTWISE NOTES');
  L.push(p.name+(p.ticket?'  |  CW #'+p.ticket:''));
  if(p.customer)L.push('Customer: '+p.customer+(p.site?'  |  Site: '+p.site:''));
  L.push('Prepared: '+todayStr());
  L.push('');
  L.push('TIME');
  L.push('----------------------------------------');
  var entries=data.timeEntries.filter(function(e){return e.projectId===p.id;})
    .sort(function(a,b){return a.startISO<b.startISO?-1:1;});
  if(!entries.length){L.push('No time entries.');}
  else{
    var byDay={},grand=0;
    entries.forEach(function(e){var d=e.startISO.slice(0,10);(byDay[d]=byDay[d]||[]).push(e);});
    Object.keys(byDay).sort().forEach(function(d){
      var kindMin={},dayMin=0;
      byDay[d].forEach(function(e){var m=entryMinutes(e);dayMin+=m;kindMin[e.kind]=(kindMin[e.kind]||0)+m;});
      grand+=dayMin;
      L.push(d+'  |  '+fmtH(dayMin));
      KINDS.forEach(function(k){if(kindMin[k])L.push('  '+k+': '+fmtH(kindMin[k]));});
      var byUser={},uOrder=[];
      byDay[d].forEach(function(e){ var k=e.userId||''; if(!byUser[k]){byUser[k]=[];uOrder.push(k);} byUser[k].push(e); });
      uOrder.forEach(function(k){
        var umin=0; byUser[k].forEach(function(e){umin+=entryMinutes(e);});
        var nm=k?(entryAuthorName(p,byUser[k][0])||'Unattributed'):'Unattributed';
        L.push('  '+nm+' — '+fmtH(umin));
        byUser[k].forEach(function(e){
          L.push('    '+e.startISO.slice(11,16)+'-'+e.endISO.slice(11,16)+'  '+e.kind+(e.notes?'  —  '+e.notes:'')+(e.lunchMin?'  ·  lunch '+e.lunchMin+' min':''));});
      });
      L.push('');
    });
    L.push('Total time: '+fmtH(grand));
  }
  L.push('');
  L.push('CABLE');
  L.push('----------------------------------------');
  var byType={};
  data.pulls.filter(function(x){return x.projectId===p.id;}).forEach(function(x){
    var t=x.run||'Unspecified'; if(x.box&&cableColorList().indexOf(x.box)>=0) t+=' ('+x.box+')';
    byType[t]=(byType[t]||0)+(Number(x.used)||0);});
  var types=Object.keys(byType);
  if(!types.length)L.push('No cable pulls logged.');
  else types.forEach(function(t){L.push(t+': '+byType[t]+' ft');});
  L.push('');
  L.push('MATERIALS');
  L.push('----------------------------------------');
  var mats=data.materials.filter(function(m){return m.projectId===p.id;});
  if(!mats.length)L.push('No materials logged.');
  else mats.forEach(function(m){
    L.push(m.qty+' x '+m.name+(m.unit?' ('+m.unit+')':'')+(m.notes?'  —  '+m.notes:''));});
  return L.join('\n').replace(/\n{3,}/g,'\n\n').replace(/\s+$/,'');
}

function importBackup(){
  var f=$('bk_file').files[0];
  if(!f){$('bk_msg').innerHTML='<div class="err">Choose a backup JSON file first.</div>';return;}
  var r=new FileReader();
  r.onload=function(){
    try{var parsed=JSON.parse(r.result);
      if(!parsed||!Array.isArray(parsed.projects))throw new Error('Not a Field Kit backup');
      var d=defaultData();for(var k in d){data[k]=parsed[k]!==undefined?parsed[k]:d[k];}
      save();goProjects();toast('Backup imported');
    }catch(e){$('bk_msg').innerHTML='<div class="err">Import failed: '+esc(e.message)+'</div>';}
  };
  r.readAsText(f);}

function migrateLocalOnce(){
  // One-time v4.x -> v5.0 migration: if a local copy + snapshot exist, push
  // only the true local diff (local vs lastSynced), then delete local keys.
  // On push failure the keys are kept so the next launch can retry.
  var raw=null, snapRaw=null;
  try{ raw=localStorage.getItem('fk_data_v1'); }catch(e){}
  try{ snapRaw=localStorage.getItem('fk_sync_snap'); }catch(e){}
  if(!raw){
    try{localStorage.removeItem('fk_sync_meta');localStorage.removeItem('fk_sync_snap');localStorage.removeItem('fk_view');}catch(e){}
    return Promise.resolve();
  }
  var localData, snap;
  try{ localData=JSON.parse(raw); snap=JSON.parse(snapRaw||'null')||emptySnapshot(); }catch(e){ return Promise.resolve(); }
  var savedData=data; data=localData;
  return pushChangesDiff(snap).then(function(){
    data=defaultData();
    try{localStorage.removeItem('fk_data_v1');localStorage.removeItem('fk_sync_meta');localStorage.removeItem('fk_sync_snap');localStorage.removeItem('fk_view');}catch(e){}
  },function(err){
    data=savedData;
    throw err;
  });
}

function leftProjectIds(snap){
  // Projects that vanished locally but belong to someone else: the user is
  // LEAVING them, not deleting them. Their records must never be tombstoned.
  var left={};
  if(!sbUser) return left;
  (snap.projects||[]).forEach(function(r){
    if(r&&r.owner_id&&r.owner_id!==sbUser.id
       &&!(data.projects||[]).some(function(p){return p.id===r.id;})) left[r.id]=1;
  });
  return left;
}

function pushChangesDiff(snap){
  var leftIds=leftProjectIds(snap);
  if(snap.__ghostIds) for(var g in snap.__ghostIds) leftIds[g]=1;
  var leftSwitches={};
  (snap.poeSwitches||[]).concat(snap.portSwitches||[]).forEach(function(s){
    if(s&&leftIds[s.projectId]) leftSwitches[s.id]=1;
  });
  function upsert(table,row){
    return sb.from(table).upsert(row,{onConflict:'id'}).then(function(r){ if(r.error) throw r.error; });
  }
  function updateRow(table,id,row){
    var o={}; for(var k in row) if(k!=='id') o[k]=row[k];
    return sb.from(table).update(o).eq('id',id).then(function(r){ if(r.error) throw r.error; });
  }
  function insertRow(table,row){
    return sb.from(table).insert(row).then(function(r){ if(r.error) throw r.error; });
  }
  function softDel(table,id){
    return sb.from(table).update({deleted_at:new Date().toISOString()}).eq('id',id)
      .then(function(r){ if(r.error) throw r.error; });
  }
  function cfgFor(key){ for(var i=0;i<SYNC_TABLES.length;i++) if(SYNC_TABLES[i].key===key) return SYNC_TABLES[i]; return null; }
  function pushTable(cfg){
    var d=diffArrays(data[cfg.key]||[],snap[cfg.key]||[]);
    var snapById={}; (snap[cfg.key]||[]).forEach(function(r){ if(r&&r.id) snapById[r.id]=1; });
    var jobs=[];
    d.added.forEach(function(r){
      if(cfg.table!=='projects'&&((r.projectId&&leftIds[r.projectId])||(r.switchId&&leftSwitches[r.switchId]))) return;
      if(cfg.table==='projects'){
        // NEVER upsert projects: ON CONFLICT DO UPDATE fails RLS for new rows
        // because the UPDATE check is_project_member(id) is false until the row
        // exists (Postgres enforces both policies on upsert). Explicit INSERT,
        // falling back to UPDATE when the row is already there (409).
        jobs.push(insertRow('projects',toDB('projects',r,true)).catch(function(e){
          if(e&&e.code==='23505'){
            var row=toDB('projects',r,false); delete row.owner_id;
            return updateRow('projects',r.id,row);

        }));

        jobs.push(upsert(cfg.table,toDB(cfg.table,r,true)));
      }
    });
    d.changed.forEach(function(r){
      if(cfg.table!=='projects'&&((r.projectId&&leftIds[r.projectId])||(r.switchId&&leftSwitches[r.switchId]))) return;
      // explicit UPDATE: ownership is set at insert and never touched here.
      // (upsert would re-run the INSERT RLS check against a row without owner_id -> 403)
      var row=toDB(cfg.table,r,false);
      delete row.owner_id;
      jobs.push(updateRow(cfg.table,r.id,row));
    });
    d.removed.forEach(function(r){
      if(cfg.table==='projects'){
        if(leftIds[r.id]){
          // Leaving a shared project: drop our own membership row instead
          // of tombstoning the owner's project. Best effort — needs the
          // "members leave project" policy; without it the delete matches
          // no rows and the project simply reappears on the next pull.
          jobs.push(sb.from('project_members').delete().eq('project_id',r.id).eq('user_id',sbUser.id)
            .then(function(){},function(){}));
          return;
        }
        jobs.push(softDel(cfg.table,r.id)); return;
      }
      if(r.projectId&&leftIds[r.projectId]) return;
      if(r.switchId&&leftSwitches[r.switchId]) return;
      jobs.push(softDel(cfg.table,r.id));
    });
    return Promise.all(jobs);
  }

  return pushTable(cfgFor('projects')).then(function(){
    // Phase 2: switches (devices/ports reference them)
    return Promise.all([pushTable(cfgFor('poeSwitches')),pushTable(cfgFor('portSwitches'))]);
  }).then(function(){
    // Phase 3: everything else
    var jobs=[];
    ['timeEntries','pulls','materials','poeDevices','portEntries','ipAssignments'].forEach(function(k){
      jobs.push(pushTable(cfgFor(k)));
    });
    jobs.push(pushTechnicians(snap));
    jobs.push(pushSettings(snap));
    return Promise.all(jobs);
  }).then(function(){});
}

function pushSettings(snap){
  var leftIds=leftProjectIds(snap);
  var live={}; (data.projects||[]).forEach(function(p){ live[p.id]=1; });
  var pids={};
  Object.keys(data.storageCalcs||{}).forEach(function(k){pids[k]=1;});
  Object.keys(data.ipSubnets||{}).forEach(function(k){pids[k]=1;});
  Object.keys((snap&&snap.settings)||{}).forEach(function(k){pids[k]=1;});
  var jobs=[];
  Object.keys(pids).forEach(function(pid){
    // Settings only ever go up for projects that exist on this device.
    // A deleted or left project leaves settings behind in the snapshot;
    // pushing them hits a tombstoned/non-member project server-side,
    // the write is refused, and the failure used to wedge the whole sync.

    var cur={storage:(data.storageCalcs||{})[pid],subnets:(data.ipSubnets||{})[pid]};
    var old=(snap.settings||{})[pid];
    if(JSON.stringify(canon(cur))!==JSON.stringify(canon(old||{}))){

function mergeRow(cfg,row){
  var arr=data[cfg.key];
  var i=idxById(arr,row.id);
  if(row.deleted_at){
    if(i>=0){ arr.splice(i,1); return true; }
    return false;
  }
  var obj=fromDB(cfg.table,row);
  if(cfg.table==='projects') obj.technicians=(i>=0&&arr[i].technicians)||[];
  if(i>=0){
    if(JSON.stringify(canon(arr[i]))!==JSON.stringify(canon(obj))){ arr[i]=obj; return true; }
    return false;
  }
  arr.push(obj); return true;
}

function fetchAllFromServer(){
  // v5.0: full fetch, every time. No incremental window, no lastPull.
  // Absence = gone, so a prune pass runs after all tables resolve.
  if(!sb||!sbUser) return Promise.resolve(false);
  var changed=false;
  var localProjCount=data.projects.length;
  var cfgOf=function(key){ for(var i=0;i<SYNC_TABLES.length;i++) if(SYNC_TABLES[i].key===key) return SYNC_TABLES[i]; return null; };
  var jobs=[];
  var seen={};
  SYNC_TABLES.forEach(function(cfg){ seen[cfg.table]={}; });
  var projCfg=cfgOf('projects');
  jobs.push(sb.from('projects').select('*').then(function(r){
    if(r.error) throw r.error;
    var rows=r.data||[], visible={};
    rows.forEach(function(row){
      visible[row.id]=1; seen.projects[row.id]=1;
      if(mergeRow(projCfg,row)) changed=true;
    });
    fetchVisibleProjects=visible;
    fetchVisibleCount=rows.length;
  }));
  SYNC_TABLES.forEach(function(cfg){
    if(cfg.table==='projects') return;
    jobs.push(sb.from(cfg.table).select('*').then(function(r){
      if(r.error) throw r.error;
      (r.data||[]).forEach(function(row){ seen[cfg.table][row.id]=1; if(mergeRow(cfg,row)) changed=true; });
    }));
  });
  jobs.push(sb.from('project_settings').select('*').then(function(r){
    if(r.error) throw r.error;
    (r.data||[]).forEach(function(row){
      var curS=(data.storageCalcs||{})[row.project_id], curN=(data.ipSubnets||{})[row.project_id];
      if(JSON.stringify(canon(row.storage_calc||null))!==JSON.stringify(canon(curS||null))){
        if(!data.storageCalcs) data.storageCalcs={};
        data.storageCalcs[row.project_id]=row.storage_calc; changed=true;
      }
      if(JSON.stringify(canon(row.ip_subnets||null))!==JSON.stringify(canon(curN||null))){
        if(!data.ipSubnets) data.ipSubnets={};
        data.ipSubnets[row.project_id]=row.ip_subnets; changed=true;
      }
    });
  }));
  return Promise.all(jobs).then(function(){
    return fetchAuthorLabels();
  }).then(function(lblChanged){
    if(lblChanged) changed=true;
    // Prune pass: full fetch means absence = gone.
    if(fetchVisibleCount||!localProjCount){
      var vis=fetchVisibleProjects;
      (data.projects||[]).slice().forEach(function(p){
        if(!vis[p.id]){ pruneLocalProject(p.id); changed=true; syncNote='A project that is no longer shared with you was removed from this device'; }
      });
    }
    SYNC_TABLES.forEach(function(cfg){
      if(cfg.table==='projects') return;
      var s=seen[cfg.table];
      data[cfg.key]=(data[cfg.key]||[]).filter(function(r){
        if(cfg.key==='poeDevices') return data.poeSwitches.some(function(sw){return sw.id===r.switchId;});
        if(cfg.key==='portEntries') return data.portSwitches.some(function(sw){return sw.id===r.switchId;});
        return !!s[r.id];
      });
    });
    Object.keys(data.storageCalcs||{}).forEach(function(pid){ if(!projById(pid)) delete data.storageCalcs[pid]; });
    Object.keys(data.ipSubnets||{}).forEach(function(pid){ if(!projById(pid)) delete data.ipSubnets[pid]; });
    if(data.timer&&data.timer.projectId&&!projById(data.timer.projectId)){
      data.timer=null;
      if(sb&&sbUser) sb.from('running_timers').delete().eq('user_id',sbUser.id).then(function(){},function(){});
    }
    serverSnap=syncableSnapshot();
    offlineCache=false; saveCache();
    return changed;
  });
}
function fetchAuthorLabels(){
  // Resolve display names for every author/editor id we hold but have not
  // resolved yet (time authors, plus updated_by editors on all row kinds).
  var miss={};
  function add(id){ if(id&&!authorLabels[id]) miss[id]=1; }
  data.timeEntries.forEach(function(e){ add(e.userId); add(e.updatedBy); });
  data.pulls.forEach(function(x){ add(x.updatedBy); });
  data.materials.forEach(function(m){ add(m.updatedBy); });
  var missIds=Object.keys(miss);
  if(!missIds.length) return Promise.resolve(false);
  return profilesQ(missIds).then(function(r2){
    var ch=false;
    (r2.data||[]).forEach(function(pr){ var l=profLabel(pr); if(l){ authorLabels[pr.id]=l; ch=true; } });

function queueRefresh(){
  if(!sb||!sbUser||syncing) return;
  if(refreshTimer) clearTimeout(refreshTimer);
  refreshTimer=setTimeout(function(){ refreshTimer=null; refreshFromServer(false); },1500);
}
function refreshFromServer(manual){
  // All fetches run through the ioChain so a refresh can never prune rows
  // from a save that is still in flight.
  // v5.3 Phase A: never refresh while changes are pending -- a fetch would
  // merge server state over unpushed local edits and prune unpushed new rows.
  // The pending push runs first (ioChain); refreshes resume after it drains.
  if(pendingChanges>0){ if(manual) toast('Changes are pending sync \u2014 refresh paused until they upload'); return Promise.resolve(false); }
  if(!sb||!sbUser||syncing) return Promise.resolve(false);
  syncing=true; setSyncStatus('refreshing');
  ioChain=ioChain.then(function(){ return fetchAllFromServer(); }).then(function(changed){
    syncing=false; setSyncStatus('ok');
    if(changed) applyRemoteChanged(!manual);
    if(manual) toast(changed?'Refreshed':'Already up to date');
    return changed;
  }).catch(function(e){
    syncing=false; syncErrMsg=(e&&e.message)||'unknown error'; setSyncStatus('offline');
    if(manual) toast('Refresh failed: '+syncErrMsg.slice(0,120));
    return false;
  });
  return ioChain;
}

/* ---------- diagnostics ---------- */
function jwtSub(){
  try{
    var s=localStorage.getItem('sb-dsmgmkstxdfohwoujkkw-auth-token');
    if(!s) return '(no stored session)';
    var tok=JSON.parse(s).access_token;
    if(!tok) return '(no access token)';
    var b=tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(atob(b)).sub||'(no sub)';
  }catch(e){ return '(decode failed)'; }
}
